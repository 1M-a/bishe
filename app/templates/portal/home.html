{% extends "portal/base.html" %}
{% block body %}

<a class="p-cta" href="{{ url_for('portalviews.report') }}">
  <span class="ico">📝</span>
  <span class="t">我要反映问题</span>
  <span class="arrow">›</span>
</a>

<div class="p-card p-progress">
  <h2><span class="bar"></span>{{ '最近办理进度' if recent_ticket else '办理进度' }}</h2>
  {% if recent_ticket %}
  <div class="p-traffic p-traffic-{{ recent_view.traffic_light }}" role="status" aria-label="{{ recent_view.traffic_text }}">
    <span class="p-traffic-lights" aria-hidden="true">
      <i class="red"></i><i class="yellow"></i><i class="green"></i>
    </span>
    <strong>{{ recent_view.traffic_text }}</strong>
  </div>
  <a class="p-btn-line" href="{{ url_for('portalviews.ticket', tid=recent_ticket.id) }}">查看最近进度</a>
  {% else %}
  <p class="p-muted">提交后，这里会显示红黄绿办理状态。</p>
  <a class="p-btn-line" href="{{ url_for('portalviews.query') }}">查询办理进度</a>
  {% endif %}
</div>

{% endblock %}
