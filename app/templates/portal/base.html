<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f5fd0">
<title>{% block title %}幸福里 · 居民服务{% endblock %}</title>
<!-- 内联 SVG 图标：不让浏览器为 /favicon.ico 吃一个 404（控制台报错会误导排查） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5fd0'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E7%A4%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ asset('css/portal.css') }}">
{% block head %}{% endblock %}
</head>
<body>
{% set ep = request.endpoint or '' %}

<div class="p-head">
  <div class="p-head-row">
    <div>
      <div class="p-brand"><span class="dot"></span>幸福里 · 居民服务</div>
    </div>
    <div class="p-head-actions">
      <button type="button" class="p-care" id="careToggle" aria-pressed="false" onclick="window.xfCare.toggle()">关怀</button>
      {% if current_user %}
      {# 已登录（登录模式居民，或开着系统来看的受控人员）：给退出入口 #}
      <form method="post" action="{{ url_for('views.logout') }}" class="p-logout-form"><button type="submit" class="p-staff p-logout" title="退出登录">退出</button></form>
      {% else %}
      <a class="p-staff" href="{{ url_for('views.login') }}">工作人员入口</a>
      {% endif %}
    </div>
  </div>
</div>

<main class="p-main">
{% block body %}{% endblock %}
</main>

<nav class="p-nav">
  <a href="{{ url_for('portalviews.home') }}" class="{{ 'on' if ep in ('portalviews.home',) else '' }}"><span class="ico">🏠</span>首页</a>
  <a href="{{ url_for('portalviews.report') }}" class="{{ 'on' if ep == 'portalviews.report' else '' }}"><span class="ico">✍️</span>反映问题</a>
  <a href="{{ url_for('portalviews.query') }}" class="{{ 'on' if ep == 'portalviews.query' else '' }}"><span class="ico">🚦</span>查进度</a>
</nav>
<script>
/* 居民端的请求封装，与内部站 base.html 的 window.api 保持同名同形状。
 *
 * 为什么不在居民页里直接写 fetch：
 *   内部站的红线是"前端请求一律走 api()"，原因不是洁癖，而是裸 fetch 会
 *   在网关返回 HTML 错误页时把 SyntaxError 当成业务错误抛出来，掩盖真实的 502/504。
 *   居民端是公网入口，更容易撞上反代错误页，所以同样需要这层归一。
 *
 * 与内部站的两点差异：
 *   1. 没有 .netbar 那个全局提示条（居民页没有这个 UI），失败用 alert 兜底；
 *   2. 超时更短（20s）。居民在手机上看，等 60s 只会以为页面卡死。
 *   返回值形状完全一致：{code, msg, data}，HTTP 非 2xx 不抛错——
 *   因为"403 没权限"和"400 参数不对"本身就是要展示给用户的业务信息。
 */
window.api = function (url, opts) {
  opts = Object.assign({}, opts || {});
  var timeout = opts.timeout || 20000;
  delete opts.timeout;
  var ctrl = new AbortController();
  opts.signal = ctrl.signal;
  var tm = setTimeout(function () { ctrl.abort(); }, timeout);
  return fetch(url, opts).then(function (r) {
    clearTimeout(tm);
    var ct = (r.headers.get('Content-Type') || '').toLowerCase();
    if (ct.indexOf('json') < 0) {
      throw new Error('服务暂时不可用（HTTP ' + r.status + '），请稍后重试');
    }
    return r.json();
  }).catch(function (e) {
    clearTimeout(tm);
    if (e && e.name === 'AbortError') throw new Error('请求超时，请检查网络后重试');
    throw e;
  });
};

/* ---------------- 关怀模式 ----------------
 * 页头开关 → localStorage 记忆 → body.care 类驱动 CSS 放大字号。
 * 打开后：页面字号整体上调（见 portal.css body.care），返回公告详情时
 * 用浏览器本地语音合成朗读全文（speechSynthesis，无网络调用）。
 * 这里把朗读能力也暴露出去（xfCare.speak），公告朗读/预警条循环朗读复用。
 */
window.xfCare = {
  KEY: 'xf_care',
  isOn: function () { return localStorage.getItem(this.KEY) === '1'; },
  btn: function () { return document.getElementById('careToggle'); },
  apply: function () {
    var on = this.isOn();
    document.body.classList.toggle('care', on);
    var btn = this.btn();
    if (btn) {
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.textContent = on ? '关怀：开' : '关怀';
    }
    if (!on && window.speechSynthesis) window.speechSynthesis.cancel();
  },
  toggle: function () {
    var next = this.isOn() ? '0' : '1';
    localStorage.setItem(this.KEY, next);
    this.apply();
  },
  /* 暂停 / 继续切换。返回当前朗读状态，供按钮更新文案。 */
  togglePause: function () {
    var sv = window.speechSynthesis;
    if (!sv) return 'idle';
    if (sv.paused) { sv.resume(); return 'speaking'; }
    if (sv.speaking) { sv.pause(); return 'paused'; }
    return 'idle';
  },
  stop: function () {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  },
  /* 朗读全文或片段；不支持 or 关怀关闭 or 正在朗读时静默返回。
   * "进入中不打断已有朗读"：上一页还没读完，进详情时不强插新朗读。 */
  speak: function (text, opts) {
    if (!this.isOn()) return false;
    if (!window.speechSynthesis) return false;
    if (window.speechSynthesis.speaking) return false;
    if (!text || !text.trim()) return false;
    var sv = window.speechSynthesis;
    var o = opts || {};
    var t = text.replace(/\s+/g, ' ').trim();
    /* Chrome/Edge 的经典坑：页面才加载完时 getVoices() 还是空列表，
     * 此时直接 speak 会无声排队、永不发声（开发者以为是"没读到"）。
     * 先等 voiceschanged 就绪再讲；没有事件通道就立即讲；
     * 300ms 兜底：偶发 voiceschanged 不触发时也不能让朗读彻底卡死。 */
    var say = function () {
      var u = new SpeechSynthesisUtterance(t);
      u.lang = o.lang || 'zh-CN';
      u.rate = o.rate || 0.95;
      u.pitch = o.pitch || 1;
      if (o.onStart) u.onstart = o.onStart;
      if (o.onPause) u.onpause = o.onPause;
      if (o.onResume) u.onresume = o.onResume;
      if (o.onEnd) u.onend = u.onerror = o.onEnd;
      sv.cancel();
      setTimeout(function () { sv.speak(u); }, 10);
    };
    var ready = sv.getVoices && sv.getVoices().length > 0;
    if (ready || !(sv.addEventListener && sv.getVoices)) {
      say();
    } else {
      var settled = false;
      var once = function () {
        if (settled) return;
        settled = true;
        sv.removeEventListener('voiceschanged', once);
        say();
      };
      sv.addEventListener('voiceschanged', once);
      if (sv.getVoices) sv.getVoices();
      setTimeout(once, 300);
    }
    return true;
  }
};
window.xfCare.apply();
</script>
{% block script %}{% endblock %}
</body>
</html>
