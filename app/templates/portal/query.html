{% extends "portal/base.html" %}
{% block title %}查进度 · 幸福里居民服务{% endblock %}
{% block body %}

{% if recent_ticket %}
<div class="p-card p-progress">
  <h2><span class="bar"></span>最近办理进度</h2>
  <div class="p-traffic p-traffic-{{ recent_view.traffic_light }}" role="status" aria-label="{{ recent_view.traffic_text }}">
    <span class="p-traffic-lights" aria-hidden="true">
      <i class="red"></i><i class="yellow"></i><i class="green"></i>
    </span>
    <strong>{{ recent_view.traffic_text }}</strong>
  </div>
  <a class="p-btn-line" href="{{ url_for('portalviews.ticket', tid=recent_ticket.id) }}">查看进度</a>
</div>
{% endif %}

<div class="p-card">
  <h2><span class="bar"></span>{{ '用查询码查其他记录' if recent_ticket else '查询办理进度' }}</h2>
  <form id="f">
    <div class="p-field">
      <label for="phone">手机号</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="提交时填的手机号">
    </div>
    <div class="p-field">
      <label for="code">查询码</label>
      <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位数字">
    </div>
    <div class="p-err" id="err"></div>
    <button class="p-btn" id="submit" type="submit">查询</button>
  </form>
</div>

{% endblock %}
{% block script %}
<script>
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var err = document.getElementById('err');
  var btn = document.getElementById('submit');
  var phone = document.getElementById('phone').value.trim();
  var code = document.getElementById('code').value.trim();
  err.textContent = '';
  if (!/^1[3-9]\d{9}$/.test(phone)) { err.textContent = '请填写正确的 11 位手机号'; return; }
  if (!/^\d{6}$/.test(code)) { err.textContent = '查询码是 6 位数字'; return; }

  btn.disabled = true; btn.textContent = '查询中…';
  try {
    var j = await api('/api/portal/ticket?phone=' + encodeURIComponent(phone)
                    + '&code=' + encodeURIComponent(code));
    if (j.code === 0 && j.data) {
      location.href = '/portal/ticket/' + j.data.id;
      return;
    }
    err.textContent = j.msg || '没有查到记录';
  } catch (e) {
    err.textContent = e.message || '网络异常，请稍后重试';
  }
  btn.disabled = false; btn.textContent = '查询';
});
</script>
{% endblock %}
